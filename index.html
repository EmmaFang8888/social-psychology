riodsPerSession": 3, "minutesPerPeriod": 45, "totalPeriods": 24, "teachingPeriods": 21, "assessmentPeriods": 3, "notice": "7次授课加第8次期中测验与整合。每次3个45分钟课时，课间休息另计。第8次建议90分钟测验加45分钟整合，正式测验要求另行公布。"}, "designNote": "按学习目标、活动与评价安排21个教学课时。每次包含三个有衔接的45分钟单元，既有概念和研究，也有应用与反馈；文献数量不按时长机械翻倍。关系与吸引、攻击、利他与合作本轮不再单设主题，可用于案例或后续课程衔接。", "designSources": [{"title": "W. W. Norton：Social Psychology 官方目录", "url": "https://wwnorton.co.uk/books/9781324045595-social-psychology"}, {"title": "CMU Eberly Center：教学目标、活动与评价对齐", "url": "https://www.cmu.edu/teaching/principles/teaching.html"}]}</script>
<script id="embedded-readings" type="application/json">[{"week": 1, "id": "w1-preregistration", "title": "The preregistration revolution", "authors": "Nosek, B. A., Ebersole, C. R., DeHaven, A. C., \u0026 Mellor, D. T.", "year": 2018, "journal": "Proceedings of the National Academy of Sciences, 115(11), 2600–2606", "doi": "10.1073/pnas.1708274114", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5856500/", "access": "开放全文（PMC）", "summary": "为什么看到结果之后编出的解释，不能直接当作事先提出的预测？文章介绍预注册如何区分验证性与探索性分析。适合配合课堂中的研究问题、假设和分析计划阅读，理解透明记录怎样帮助读者判断证据，而不是把预注册当作保证结论正确的印章。", "question": "如果研究者看到结果后提出一个新假设，应当怎样报告，又需要什么新证据？", "level": "core", "readingGuide": "优先阅读摘要及区分预测与事后解释的开头段落。", "periods": [2, 3]}, {"week": 1, "id": "w1-reproducibility", "title": "Estimating the reproducibility of psychological science", "authors": "Open Science Collaboration", "year": 2015, "journal": "Science, 349(6251), aac4716", "doi": "10.1126/science.aac4716", "url": "https://repository.essex.ac.uk/17970/", "access": "摘要与文献信息（大学资料库；全文需另行获取）", "summary": "大规模合作项目重复了来自三本心理学期刊的100项研究，并采用多种标准比较原研究与重复研究。阅读重点是：可重复性需要如何评价，为什么一次显著结果不足以结束讨论；不能把这组研究的结果直接当作所有心理学研究的总体成功率。", "question": "重复研究的结果与原研究不同，是否就能断定原研究造假？还应检查什么？", "level": "extension", "readingGuide": "先读中文导读与资料库摘要，区分可重复性、效应大小和统计显著性。", "periods": [2, 3]}, {"week": 1, "id": "w1-generality", "title": "Constraints on Generality (COG): A Proposed Addition to All Empirical Papers", "authors": "Simons, D. J., Shoda, Y., \u0026 Lindsay, D. S.", "year": 2017, "journal": "Perspectives on Psychological Science, 12(6), 1123–1128", "doi": "10.1177/1745691617708630", "url": "https://journals.sagepub.com/doi/abs/10.1177/1745691617708630", "access": "出版社摘要（全文可能需要机构访问）", "summary": "实验通常只研究特定参与者、刺激和情境，却可能被讲成对所有人都成立的规律。作者建议明确写出结论适用于哪些对象与条件，以及推广的理由。这篇短文可以成为贯穿全课的阅读工具，帮助学生追问经典实验的边界，而不只记住结果。", "question": "如果实验只招募某校大学生，哪些结论可以提出，哪些推广仍需新的研究？", "level": "extension", "readingGuide": "阅读摘要，尝试为一项课堂实验写一句结论适用范围。", "periods": [2, 3]}, {"week": 2, "id": "w2-correspondence", "title": "The correspondence bias", "authors": "Gilbert, D. T., \u0026 Malone, P. S.", "year": 1995, "journal": "Psychological Bulletin, 117(1), 21–38", "doi": "10.1037/0033-2909.117.1.21", "url": "https://dtg.sites.fas.harvard.edu/Gilbert%20%26%20Malone%20%28CORRESPONDENCE%20BIAS%29.pdf", "access": "作者网站全文（PDF）", "summary": "看到一个人的行为时，我们可能过快推断其稳定性格，而没有充分考虑情境。综述区分了形成对应偏差的不同机制，包括没有意识到限制和修正不足。适合用课堂迟到、公开发言等案例练习：对行为的解释，应保留哪些个人与情境的可能性？", "question": "同学在讨论中保持沉默，为什么不能立即判断他不愿合作？还需要什么情境信息？", "level": "core", "readingGuide": "优先读摘要、个人与情境的区分及机制示例，不必逐一记忆所有文献。", "periods": [2]}, {"week": 2, "id": "w2-heuristics", "title": "Judgment under Uncertainty: Heuristics and Biases", "authors": "Tversky, A., \u0026 Kahneman, D.", "year": 1974, "journal": "Science, 185(4157), 1124–1131", "doi": "10.1126/science.185.4157.1124", "url": "https://pubmed.ncbi.nlm.nih.gov/17835457/", "access": "摘要与出版社链接（全文可能需要机构访问）", "summary": "经典文章介绍代表性、可得性和锚定调整等判断捷径。这些方式节省认知资源，却可能在特定条件下产生可预测的偏差。阅读时把每个例子拆成提供了什么信息、忽略了什么信息、怎样改善判断，避免将启发式简单等同于非理性。", "question": "一则生动新闻让人高估某种事件的频率，怎样的信息能帮助校正判断？", "level": "extension", "readingGuide": "先读摘要，再选择一个启发式联系日常判断进行分析。", "periods": [1]}, {"week": 2, "id": "w2-cultural-cognition", "title": "Culture and systems of thought: Holistic versus analytic cognition", "authors": "Nisbett, R. E., Peng, K., Choi, I., \u0026 Norenzayan, A.", "year": 2001, "journal": "Psychological Review, 108(2), 291–310", "doi": "10.1037/0033-295X.108.2.291", "url": "https://sites.lsa.umich.edu/nisbett/wp-content/uploads/sites/370/2016/03/cultureThought.pdf", "access": "作者网站全文（作者稿PDF）", "summary": "综述提出整体与分析性认知的文化框架，讨论注意、因果解释和推理如何受到文化实践影响。它能将本周社会认知与后续情绪文化内容连接起来。应把这些结果理解为特定研究样本中的倾向，并追问测量与情境，不能把东西方当作两种固定的人。", "question": "研究发现群体平均差异后，为什么仍不能直接预测某位中国或美国学生的判断方式？", "level": "extension", "readingGuide": "阅读摘要与因果归因部分；链接为作者稿，版式与正式出版版不同。", "periods": [3]}, {"week": 3, "id": "mesquita-1992", "title": "Cultural variations in emotions: A review", "authors": "Mesquita, B., \u0026 Frijda, N. H.", "year": 1992, "journal": "Psychological Bulletin, 112(2), 179–204", "doi": "10.1037/0033-2909.112.2.179", "url": "https://ppw.kuleuven.be/cscp/documents/mesquita/mesquita-frijda-1992-cultural-variations-in.pdf", "access": "大学网站全文（PDF）", "level": "core", "summary": "经典综述把情绪放回多个过程环节，梳理跨文化的相似性与差异。它提供本节的总框架：某一环节相似，不代表其他环节也完全相同。它早于部分理想情绪研究，不能替代本节所有具体理论与新证据。", "question": "为什么发现相似的表情识别，并不能推出不同文化中的情绪体验与表达规则完全相同？", "readingGuide": "先读中文导读和摘要，再选读评价、体验及表达相关段落。", "titleZh": "情绪的文化差异：综述", "periods": [1]}, {"week": 3, "id": "ekman-1971", "title": "Constants across cultures in the face and emotion", "authors": "Ekman, P., \u0026 Friesen, W. V.", "year": 1971, "journal": "Journal of Personality and Social Psychology, 17(2), 124–129", "doi": "10.1037/h0030377", "url": "https://pubmed.ncbi.nlm.nih.gov/5542557/", "access": "文献信息与摘要（PubMed；全文另需获取）", "level": "extension", "summary": "Fore研究通过故事与表情照片匹配，考察较少接触西方文化的参与者能否识别若干表情。它为跨文化相似性提供证据，也适合讨论强迫选择任务、备选数量与随机水平。研究不能证明所有情绪成分均由先天决定。", "question": "成人三选一和儿童二选一的准确率，为什么不能直接用于比较谁更擅长识别？", "periods": [1]}, {"week": 3, "id": "li-2004", "title": "The organisation of Chinese shame concepts", "authors": "Li, J., Wang, L., \u0026 Fischer, K. W.", "year": 2004, "journal": "Cognition and Emotion, 18(6), 767–797", "doi": "10.1080/02699930341000202", "url": "https://doi.org/10.1080/02699930341000202", "access": "出版社入口（全文可能需要机构访问）", "level": "extension", "summary": "作者收集113项中文羞耻相关词语并研究其概念组织，为理解文化中的细分与突出程度提供线索。113指相关词项，并非113种独立情绪。词语数量不能直接表示体验频率，也不能与教材概述的英文数量当作严格配对实验。", "question": "从词语分类结果到“中国人更常感到羞愧”的结论，中间还缺少哪些证据？", "periods": [1]}, {"week": 3, "id": "scherer-2005", "title": "What are emotions? And how can they be measured?", "authors": "Scherer, K. R.", "year": 2005, "journal": "Social Science Information, 44(4), 695–729", "doi": "10.1177/0539018405058216", "url": "https://journals.sagepub.com/doi/10.1177/0539018405058216", "access": "出版社入口（全文可能需要机构访问）", "level": "extension", "summary": "从成分过程角度讨论情绪的定义及测量，帮助区分认知评价、主观感受、生理反应、表达与行动准备。适合对应课堂的五成分示例，思考为什么一张表情照片或一道自评题不能囊括情绪的全部信息。", "question": "如果要研究受到表扬时的情绪，除了询问开心程度，还能测量哪些成分？", "periods": [1]}, {"week": 3, "id": "matsumoto-2005", "title": "Development and validation of a measure of display rule knowledge: The Display Rule Assessment Inventory", "authors": "Matsumoto, D., Yoo, S. H., Hirayama, S., \u0026 Petrova, G.", "year": 2005, "journal": "Emotion, 5(1), 23–40", "doi": "10.1037/1528-3542.5.1.23", "url": "https://www.davidmatsumoto.com/content/2005%20matsumoto%20yoo%20hirayama%20petrova.pdf", "access": "作者网站全文（PDF）", "level": "extension", "summary": "文章把表达规则转化为可研究的表达方式与情境判断，并报告跨文化测量证据。可对应礼物互动和美日影片实验，区分内心感受、外在表达与合宜性规范。量表报告的规范知识，也不等于每一次真实互动中都如此表现。", "question": "“减少表露”是一种表达方式；什么信息才能让它成为关于表达规则的判断？", "periods": [1]}, {"week": 3, "id": "tsai-2006", "title": "Cultural variation in affect valuation", "authors": "Tsai, J. L., Knutson, B., \u0026 Fung, H. H.", "year": 2006, "journal": "Journal of Personality and Social Psychology, 90(2), 288–307", "doi": "10.1037/0022-3514.90.2.288", "url": "https://stanford.edu/group/spanlab/Publications/jt06jpsp.pdf", "access": "作者大学网站全文（PDF）", "level": "extension", "summary": "研究区分人们实际感到什么与希望感到什么，并比较不同文化样本对高、低唤醒正性状态的重视程度。理想情绪并不等于真实体验。阅读时关注如何分别测量两者，以及群体平均差异为何不能直接套用于某个人。", "question": "一个人希望自己平静，能否据此判断他现在很平静，或脸上不会表现兴奋？", "periods": [1]}, {"week": 3, "id": "tsai-2007", "title": "Learning what feelings to desire: Socialization of ideal affect through children's storybooks", "authors": "Tsai, J. L., Louie, J. Y., Chen, E. E., \u0026 Uchida, Y.", "year": 2007, "journal": "Personality and Social Psychology Bulletin, 33(1), 17–30", "doi": "10.1177/0146167206292749", "url": "https://bingschool.stanford.edu/sites/bingschool/files/2007_tsaietal.pdf", "access": "大学网站全文（PDF）", "level": "extension", "summary": "文章连接儿童的理想情绪偏好、美国与中国台湾绘本中的表情，以及短期故事阅读实验。文化产品既可反映情绪偏好，也可能参与塑造偏好。阅读时区分文化比较与随机实验，不把短期活动偏好变化说成长期人格改变。", "question": "绘本内容比较和故事阅读实验，分别支持什么结论？", "periods": [1]}, {"week": 3, "id": "tracy-2008", "title": "The spontaneous expression of pride and shame: Evidence for biologically innate nonverbal displays", "authors": "Tracy, J. L., \u0026 Matsumoto, D.", "year": 2008, "journal": "Proceedings of the National Academy of Sciences, 105(33), 11655–11660", "doi": "10.1073/pnas.0802686105", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2575323/", "access": "开放全文（PMC）", "level": "extension", "summary": "研究比较明眼、盲人与先天盲运动员赛后的自发身体表达。部分相似的自豪表达提示，视觉模仿并非这些表达出现的必要条件。观察到的身体行为与主观体验仍需区分；不能据此把所有情绪都解释为固定不变的先天程序。", "question": "先天盲者的证据削弱了哪一种学习解释？它还不能排除什么？", "periods": [1]}, {"week": 3, "id": "sims-2014", "title": "Choosing a physician depends on how you want to feel: The role of ideal affect in health-related decision making", "authors": "Sims, T., Tsai, J. L., Koopmann-Holm, B., Thomas, E. A. C., \u0026 Goldstein, M. K.", "year": 2014, "journal": "Emotion, 14(1), 187–192", "doi": "10.1037/a0034372", "url": "https://culture-emotion-lab.stanford.edu/sites/culture_emotion_lab/files/media/file/sims_et_al_2014_0.pdf", "access": "作者大学网站全文（PDF）", "level": "extension", "summary": "美国大学生在情境任务中的医生偏好，与其希望体验兴奋或平静的程度有关。它把理想情绪连接到实际生活中的选择问题，但研究测量的是选择意愿，不是实际就诊或疗效；也不能当作一个中美两组比较实验。", "question": "这一研究的样本、医生介绍和结果变量，分别是什么？哪些实际行为仍未测量？", "periods": [1]}, {"week": 3, "id": "tsai-2016", "title": "Leaders' smiles reflect cultural differences in ideal affect", "authors": "Tsai, J. L., Ang, J. Y. Z., Blevins, E., et al.", "year": 2016, "journal": "Emotion, 16(2), 183–195", "doi": "10.1037/emo0000133", "url": "https://culture-emotion-lab.stanford.edu/sites/culture_emotion_lab/files/media/file/tsai_et_al_leaders_smiles_2016.pdf", "access": "作者大学网站全文（PDF）", "level": "extension", "summary": "研究通过官方照片编码与跨文化理想情绪测量，考察文化重视的状态与领导人笑容的关系。中美比较包含政界、企业与高校领导人。照片反映公开呈现的表达，不能直接诊断个人幸福程度，多文化相关也不等于单向因果。", "question": "为什么领导人照片中的兴奋笑容，不能直接证明他们内心更快乐？", "periods": [1]}, {"week": 3, "id": "zhang-2024-ideal-affect", "title": "中国人的积极理想情绪：近几十年来的变迁", "authors": "张明杨, 杨盈, 包寒吴霜, 蔡华俭", "year": 2024, "journal": "心理学报, 56(7), 847–858", "doi": "10.3724/SP.J.1041.2024.00847", "url": "https://journal.psych.ac.cn/xlxb/CN/Y2024/V56/I7/847", "access": "期刊网站摘要与全文入口", "level": "extension", "summary": "本研究以历史时期的回溯判断、代际知觉及城乡大学生调查，探讨中国人的积极理想情绪。它把课堂的文化间比较延伸到同一社会内部的变迁。阅读时区分被试对过去和代际的判断、横断调查与真正的长期追踪，不能把它们当作相同的时间证据，也不把兴奋和平静看成只能二选一。", "question": "对过去的回溯判断、代际知觉与城乡横断调查，分别能支持什么？为什么还需要纵向证据？", "readingGuide": "课件拓展阅读（中文）。先读摘要，再比较三个研究的设计。联系理想情绪，思考文化如何变化，而非只记住国家差异。", "periods": [1]}, {"week": 3, "id": "vankleef-2009", "title": "How emotions regulate social life: The emotions as social information (EASI) model", "authors": "Van Kleef, G. A.", "year": 2009, "journal": "Current Directions in Psychological Science, 18(3), 184–188", "doi": "10.1111/j.1467-8721.2009.01633.x", "url": "https://dare.uva.nl/id/338a3397-22f3-48b1-a5c7-4d4bb82c838b", "access": "大学开放资料库（附全文PDF）", "level": "extension", "summary": "EASI模型提出，情绪表达可通过引起观察者的情感反应，以及让观察者作出推断，影响社会互动。两条路径可能带来不同回应，其作用受信息加工和社会关系条件调节。这为上一课时从“表达什么”转向“表达如何影响彼此”提供框架。", "question": "同样看到对方生气，为什么有人退让，有人反感？分别可能涉及哪条路径？", "readingGuide": "优先阅读模型图、两条作用路径及调节因素的例子。", "periods": [2]}, {"week": 3, "id": "keltner-1999", "title": "Social functions of emotions at four levels of analysis", "authors": "Keltner, D., \u0026 Haidt, J.", "year": 1999, "journal": "Cognition and Emotion, 13(5), 505–521", "doi": "10.1080/026999399379168", "url": "https://greatergood.berkeley.edu/dacherkeltner/docs/keltner.haidt.social.functions.cogemo.1999.pdf", "access": "作者大学网站全文（PDF）", "level": "extension", "summary": "综述从个体、双人、群体与文化四个层次讨论情绪的社会功能，并以尴尬说明各层次如何联系。情绪不仅是内部感受，也参与协调社会问题。功能分析并不意味着每次情绪表达都会产生有益后果。", "question": "尴尬表达可能怎样影响观察者对一个人的判断？这与尴尬的主观不适有什么不同？", "periods": [2]}, {"week": 3, "id": "algoe-2012", "title": "Find, remind, and bind: The functions of gratitude in everyday relationships", "authors": "Algoe, S. B.", "year": 2012, "journal": "Social and Personality Psychology Compass, 6(6), 455–469", "doi": "10.1111/j.1751-9004.2012.00439.x", "url": "https://compass.onlinelibrary.wiley.com/doi/abs/10.1111/j.1751-9004.2012.00439.x", "access": "出版社摘要（全文可能需要机构访问）", "level": "extension", "summary": "感激的发现、提醒与联结理论强调，感激可能帮助人们识别并维系积极回应自己的关系伙伴。阅读重点是从“偿还人情”的交换解释，转向关系形成与维护，并思考怎样用互动证据检验这一机制。", "question": "表达感谢之后关系变好，是否足以证明是感激造成的？还需要怎样的设计？", "periods": [2]}, {"week": 3, "id": "vankleef-2022", "title": "The social effects of emotions", "authors": "Van Kleef, G. A., \u0026 Côté, S.", "year": 2022, "journal": "Annual Review of Psychology, 73, 629–658", "doi": "10.1146/annurev-psych-020821-010855", "url": "https://www.annualreviews.org/content/journals/10.1146/annurev-psych-020821-010855", "access": "出版社综述入口（全文权限依页面而定）", "level": "extension", "summary": "较新的综述系统讨论情绪表达对观察者感受、认知与行为的影响，并联系情绪传染、情绪调节和EASI理论。适合在掌握两条基本路径后拓展，重点比较不同表达渠道、情境和研究方法的结论边界。", "question": "面对面表情与文字中的情绪表达，哪些机制可能相同，又应检验哪些差异？", "periods": [2]}, {"week": 3, "id": "gross-1998-regulation", "periods": [3], "title": "The emerging field of emotion regulation: An integrative review", "titleZh": "情绪调节研究的兴起：整合性综述", "authors": "Gross, J. J.", "year": 1998, "journal": "Review of General Psychology, 2(3), 271–299", "doi": "10.1037/1089-2680.2.3.271", "url": "https://journals.sagepub.com/doi/10.1037/1089-2680.2.3.271", "access": "出版社入口（全文可能需要机构访问）", "level": "extension", "summary": "经典综述用过程模型组织情绪调节，区分对情境、注意、认知及反应的调整。它为情绪课第3课时提供框架：先明确想改变的情绪过程，再比较可用策略及情境限制。模型不是策略优劣排行榜，不能据此断定重评在所有情境下都最好。", "question": "一次小组冲突中，改变情境、改变解释与压住表情分别调整什么？需要什么证据比较效果？", "readingGuide": "选读模型图和五类调节位置。与本节情绪成分及表达规则比较，区分规范、实际策略与调节结果。"}, {"week": 3, "id": "diener-2003-wellbeing", "periods": [3], "title": "Personality, culture, and subjective well-being: Emotional and cognitive evaluations of life", "titleZh": "人格、文化与主观幸福感：对生活的情绪与认知评价", "authors": "Diener, E., Oishi, S., \u0026 Lucas, R. E.", "year": 2003, "journal": "Annual Review of Psychology, 54, 403–425", "doi": "10.1146/annurev.psych.54.101601.145056", "url": "https://pubmed.ncbi.nlm.nih.gov/12172000/", "access": "文献信息与摘要（PubMed；全文另需获取）", "level": "extension", "summary": "综述区分生活满意度与情绪体验，并讨论人格、生活条件及文化如何联系主观幸福感。用于情绪课第3课时，帮助理解短时开心与对整体生活的评价并不相同，也避免把幸福感完全归因于个人性格或一次文化比较。", "question": "一次活动让人当下更开心，是否足以证明长期生活满意度提高？还应测量什么？", "readingGuide": "先读摘要，区分情绪性与认知性评价。把文化比较中的测量可比性列为一个阅读问题。"}, {"week": 4, "id": "greenwald-2022", "title": "Best research practices for using the Implicit Association Test", "authors": "Greenwald, A. G., Brendl, M., Cai, H., et al.", "year": 2022, "journal": "Behavior Research Methods, 54, 1161–1180", "doi": "10.3758/s13428-021-01624-3", "url": "https://link.springer.com/article/10.3758/s13428-021-01624-3", "access": "出版商开放全文（HTML与PDF）", "summary": "这篇方法指南讨论IAT的类别与材料、实施流程、信度和结果报告。重点阅读内隐的定义与测量特征两节：直接或间接的测量方式，不应简单等同于有意识或无意识；单次测量还存在误差，不能据一次分数对个人作准确诊断。", "question": "小林一次IAT出现配对差异。哪些判断有依据，哪些判断超出了证据？重复测量能解决所有解释问题吗？", "level": "core", "readingGuide": "优先阅读Definition of implicit与Measurement characteristics两节，技术附录可选读。", "titleZh": "内隐联想测验的研究最佳实践", "periods": [1, 3]}, {"week": 4, "id": "ajzen-1991", "title": "The theory of planned behavior", "authors": "Ajzen, I.", "year": 1991, "journal": "Organizational Behavior and Human Decision Processes, 50(2), 179–211", "doi": "10.1016/0749-5978(91)90020-T", "url": "https://doi.org/10.1016/0749-5978(91)90020-T", "access": "出版社摘要；全文通常需要机构权限", "summary": "计划行为理论把态度与行为之间的关系放回具体情境。对某一行为的态度、主观规范与知觉行为控制共同关联行为意向，意向与控制条件再关联实际行动。它提醒我们：一般好感并不等于具体选择，行为预测需要对象、行动与情境相匹配。", "question": "一个人赞成环保却很少自带杯子，除态度之外，还应了解哪些规范、意向与控制条件？", "level": "extension", "periods": [2]}, {"week": 4, "id": "greenwald-1998", "title": "Measuring individual differences in implicit cognition: The Implicit Association Test", "authors": "Greenwald, A. G., McGhee, D. E., \u0026 Schwartz, J. L. K.", "year": 1998, "journal": "Journal of Personality and Social Psychology, 74(6), 1464–1480", "doi": "10.1037/0022-3514.74.6.1464", "url": "https://faculty.washington.edu/agg/FullText/GM%26S1998/FullText.htm", "access": "作者大学网站全文（HTML）", "summary": "IAT最初的三项实验通过切换联合分类的配对，间接考察概念之间的相对联结。阅读时重点追踪目标类别、属性类别、同键规则与反应时差异，理解任务为什么能提供自我报告之外的信息，同时避免把分类快慢直接解释为一个人的真实想法。", "question": "IAT的两种联合分类究竟改变了什么？为什么测得的是相对联结，而不是对某个群体的单独评价？", "level": "extension", "periods": [1]}, {"week": 4, "id": "ratliff-2024", "title": "The Implicit Association Test", "authors": "Ratliff, K. A., \u0026 Smith, C. T.", "year": 2024, "journal": "Dædalus, 153(1), 51–64", "doi": "10.1162/daed_a_02048", "url": "https://www.amacad.org/publication/daedalus/implicit-association-test", "access": "出版机构开放全文（HTML）", "level": "extension", "summary": "面向较广泛读者的文章，介绍IAT程序、社会传播、解释争议和未来研究问题。可对应课件中的公众参与与社会影响，区分传播规模与测量效度，也要注意作者对内隐构念的观点，不把一种理论解释当作全领域唯一共识。", "question": "测试参与次数很多，为什么仍不能单凭这一点证明对某个人的解释准确？", "periods": [1, 3]}, {"week": 4, "id": "yang-2015-iat-applications", "title": "内隐联系测验的应用：国内外研究现状", "authors": "杨紫嫣, 刘云芝, 余震坤, 蔡华俭", "year": 2015, "journal": "心理科学进展, 23(11), 1966–1980", "doi": "10.3724/SP.J.1042.2015.01966", "url": "https://journal.psych.ac.cn/xlkxjz/CN/10.3724/SP.J.1042.2015.01966", "access": "期刊网站摘要与PDF入口", "level": "extension", "summary": "这篇中文综述介绍IAT在心理健康、教育、职业、消费等领域的应用，帮助把课堂中的联合分类任务与现实研究问题联系起来。它反映的是发表当时的应用证据。请同时参照Greenwald等（2022）的测量指南，区分群体研究中的预测联系与对某个学生一次合作选择的确定判断。", "question": "任选一个应用领域：需要测量什么实际结果，才能检验IAT的预测价值？为什么不能直接给个人定性？", "readingGuide": "课件拓展阅读（中文）。选读一个应用领域，写出目标构念、测量指标与实际行为。再对照2022年指南检查解释边界。", "periods": [3]}, {"week": 5, "id": "petty-1981", "title": "Personal involvement as a determinant of argument-based persuasion", "authors": "Petty, R. E., Cacioppo, J. T., \u0026 Goldman, R.", "year": 1981, "journal": "Journal of Personality and Social Psychology, 41(5), 847–855", "doi": "10.1037/0022-3514.41.5.847", "url": "https://richardepetty.com/wp-content/uploads/2019/01/1981-jpsp-pettycacioppogoldman.pdf", "access": "作者网站PDF入口", "summary": "研究同时改变议题与参与者的关联程度、论据强弱和来源专业性，考察哪些信息更能影响态度。重点比较高低关联条件下的加工差异，理解说服效果取决于受众的投入程度。不要把中央与外周加工理解为两种固定的人，或认定专家身份总是外周线索。", "question": "同一位专家的同一段建议，为什么在与自己密切相关和关系较小时，可能经由不同信息影响判断？", "level": "core", "periods": [1]}, {"week": 5, "id": "festinger-1959", "title": "Cognitive consequences of forced compliance", "authors": "Festinger, L., \u0026 Carlsmith, J. M.", "year": 1959, "journal": "Journal of Abnormal and Social Psychology, 58(2), 203–210", "doi": "10.1037/h0041593", "url": "https://www.yorku.ca/pclassic/Festinger/", "access": "约克大学经典文献全文（HTML）", "summary": "参与者完成枯燥任务后，因不同报酬向他人介绍任务很有趣。研究借此检验行为与原有认识不一致时，外部理由的充分程度如何关联后续态度。阅读时应区分报酬、对行为的解释和态度改变，不能把结果简化为报酬越低，人就一定越喜欢任务。", "question": "如果报酬为行为提供了充分的外部理由，为什么反而可能减少改变原有态度的需要？", "level": "extension", "periods": [2]}, {"week": 5, "id": "wood-2000", "title": "Attitude change: Persuasion and social influence", "authors": "Wood, W.", "year": 2000, "journal": "Annual Review of Psychology, 51, 539–570", "doi": "10.1146/annurev.psych.51.1.539", "url": "https://dornsife.usc.edu/wendy-wood/wp-content/uploads/sites/183/2023/10/Wood.2000_Attitude_change.pdf", "access": "作者大学网站全文（PDF）", "summary": "综述把信息说服与社会影响联系起来，讨论准确理解世界、维护自我和维系关系等动机如何影响态度改变。可选读动机与双加工部分，把来源、论据、情感和群体规范放在同一框架中比较，也注意公开同意并不总等于私下不认同。", "question": "同意他人的观点，可能出于哪些不同动机？能否只根据公开或私下表达，判断一个人是否真正改变了态度？", "level": "extension", "periods": [1, 3]}, {"week": 6, "id": "w7-compliance-conformity", "title": "Social Influence: Compliance and Conformity", "authors": "Cialdini, R. B., \u0026 Goldstein, N. J.", "year": 2004, "journal": "Annual Review of Psychology, 55, 591–621", "doi": "10.1146/annurev.psych.55.090902.142015", "url": "https://www.annualreviews.org/content/journals/10.1146/annurev.psych.55.090902.142015", "access": "出版社摘要（全文可能需要机构访问）", "summary": "综述从准确理解现实、维持社会关系和保持积极自我概念等动机，解释人为什么受到他人的影响。它帮助学生把从众与顺从的具体策略放回心理过程，也提醒我们：社会影响不一定是显眼命令，有时通过规范与环境线索发生。", "question": "同样是跟随多数意见，怎样区分追求判断准确与担心被群体拒绝？", "level": "core", "readingGuide": "先读摘要，用三个动机分析一个校园中的社会影响情境。", "periods": [1, 2, 3]}, {"week": 6, "id": "w7-culture-conformity", "title": "Culture and conformity: A meta-analysis of studies using Asch's (1952b, 1956) line judgment task", "authors": "Bond, R., \u0026 Smith, P. B.", "year": 1996, "journal": "Psychological Bulletin, 119(1), 111–137", "doi": "10.1037/0033-2909.119.1.111", "url": "https://doi.org/10.1037/0033-2909.119.1.111", "access": "出版社入口（全文可能需要机构访问）", "summary": "元分析整合不同国家与时期的Asch式线段判断研究，考察从众是否随社会文化环境而变化。它补充了单个经典实验的视角：情境效应也有文化与历史边界。阅读时注意国家层面指标与个体行为不能直接互换，相关差异也不是文化因果的最终证明。", "question": "国家层面的集体主义指标与从众有关，能否据此断定某位学生一定更容易从众？", "level": "extension", "readingGuide": "把摘要与课堂的Asch任务对照，重点理解元分析和跨文化推广的意义。", "periods": [1]}, {"week": 6, "id": "w7-obedience", "title": "Replicating Milgram: Would people still obey today?", "authors": "Burger, J. M.", "year": 2009, "journal": "American Psychologist, 64(1), 1–11", "doi": "10.1037/a0010932", "url": "https://pubmed.ncbi.nlm.nih.gov/19209958/", "access": "文献信息与摘要（PubMed；全文另需获取）", "summary": "研究在增加筛查与退出保障的条件下，部分重复了Milgram服从程序，并在150伏节点停止。适合讨论研究伦理与结果可比性：现代研究仍显示权威情境的重要作用，但部分重复与原程序并不完全相同，不能把两者概括成毫无变化。", "question": "为了保护参与者而修改程序后，哪些比较仍有意义，哪些结论必须更加谨慎？", "level": "extension", "readingGuide": "先读摘要；可结合APA研究介绍比较两项程序。", "additionalUrl": "https://www.apa.org/news/press/releases/2008/12/replicating-milgram", "periods": [2]}, {"week": 7, "id": "pettigrew-2006", "title": "A meta-analytic test of intergroup contact theory", "authors": "Pettigrew, T. F., \u0026 Tropp, L. R.", "year": 2006, "journal": "Journal of Personality and Social Psychology, 90(5), 751–783", "doi": "10.1037/0022-3514.90.5.751", "url": "https://sparq.stanford.edu/sites/g/files/sbiybj19021/files/media/file/pettigrew_tropp_2006_-_intergroup_contact_theory.pdf", "access": "斯坦福大学研究团队网站全文（PDF）", "summary": "这项元分析汇集大量研究，评估群际接触与偏见的关系，并比较接触条件。阅读重点是把总体证据与具体情境区分开：平等地位、共同目标、合作和制度支持等条件通常有利，但不宜把接触写成任何人、任何时候都有效的去偏见方法。", "question": "如果要设计跨专业学生合作活动，怎样创造有利于群际接触的条件？只把两组人放在一起是否足够？", "level": "core", "periods": [3]}, {"week": 7, "id": "devine-1989", "title": "Stereotypes and prejudice: Their automatic and controlled components", "authors": "Devine, P. G.", "year": 1989, "journal": "Journal of Personality and Social Psychology, 56(1), 5–18", "doi": "10.1037/0022-3514.56.1.5", "url": "https://doi.org/10.1037/0022-3514.56.1.5", "access": "出版社文献页；全文可能需要机构权限", "summary": "经典研究区分对文化刻板印象的知识、相关内容的激活，以及人们是否认可和采用这些内容。它为理解自动与控制加工提供起点。阅读时不要把文化中存在某种联结，直接等同于某个人认可偏见，也不要把当年的模型写成所有情境都必然出现的规律。", "question": "知道某种刻板印象，与赞同它、用它评价他人、据此采取行动，有什么区别？", "level": "extension", "accessNote": "作者实验室另有PDF入口，但本轮打开遇到JavaScript人机验证，因此不把它标为已验证可直接读全文。", "periods": [1, 2]}, {"week": 7, "id": "lai-2016", "title": "Reducing implicit racial preferences: II. Intervention effectiveness across time", "authors": "Lai, C. K., Skinner, A. L., Cooley, E., et al.", "year": 2016, "journal": "Journal of Experimental Psychology: General, 145(8), 1001–1016", "doi": "10.1037/xge0000179", "url": "https://rssclab.ucr.edu/wp-content/uploads/2019/08/Reducing-implicit-racial-preferences-II-Intervention-effectiveness-across-time.pdf", "access": "作者大学实验室网站接受稿（PDF）", "summary": "两项研究比较多种短时干预，并在延迟后再次测量内隐种族偏好。即时变化未在后续测量中保持，说明指标的可塑性与持久改变是不同问题。本研究不能证明所有干预都无效；它提供了为什么必须设置随访，并区分测量变化与社会行为改变的例子。", "question": "为什么一次干预后IAT分数下降，还不能证明偏见已经被长期消除？后测与延迟测量各回答什么问题？", "level": "extension", "periods": [2, 3]}, {"week": 7, "id": "paluck-2021", "title": "Prejudice reduction: Progress and challenges", "authors": "Paluck, E. L., Porat, R., Clark, C. S., \u0026 Green, D. P.", "year": 2021, "journal": "Annual Review of Psychology, 72, 533–560", "doi": "10.1146/annurev-psych-071620-030619", "url": "https://www.annualreviews.org/doi/pdf/10.1146/annurev-psych-071620-030619", "access": "出版社全文（PDF）", "summary": "综述系统评估减少偏见的实验研究，特别关注干预是否持续、测量是否贴近现实以及结果是否透明。它提醒我们，短暂训练后指标改善不等于长期行为改变；评价公平教育与反歧视项目，需要追踪时间、实际行为以及更广泛的制度和互动条件。", "question": "一项培训结束后，参与者问卷更积极。要说它减少了现实歧视，还需要怎样的随访、对照与行为证据？", "level": "extension", "periods": [3]}]</script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let course,readings,tab='knowledge',filter='all',periodFilter='all';
const tabs=[['knowledge','核心知识'],['readings','研究与阅读'],['practice','练习反馈'],['ai','AI辅助阅读']];
function notify(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2400);}
async function copy(t){try{await navigator.clipboard.writeText(t);notify('已复制，可粘贴使用');}catch{notify('请选中文字，使用系统复制功能');}}
function citation(r){return `${r.authors} (${r.year}). ${r.title}. ${r.journal}. https://doi.org/${r.doi}`;}
function current(){const m=location.hash.match(/^#week-([1-8])$/);return m?Number(m[1]):location.hash==='#all'?'all':'home';}
function paper(r){const action=/全文|作者稿|接受稿/.test(r.access)&&!(/未核验|全文需|全文另|全文可能|全文通常|权限/.test(r.access))?'阅读全文':'查看阅读入口';return `<article class="paper" id="${esc(r.id)}"><div class="paper-top"><span class="level">${r.level==='core'?'重点阅读':'选读拓展'}</span><span class="source-type">第${r.week}次课${r.periods?.length?` · 第${r.periods.join("、")}课时`:""} · ${esc(r.access)}</span></div><h3>${esc(r.title)}</h3>${r.titleZh?`<p class="small">中文题名译注：${esc(r.titleZh)}</p>`:''}<div class="citation">${esc(r.authors)} (${r.year}). ${esc(r.journal)}.<br>DOI: ${esc(r.doi)}</div><p class="abstract"><b>中文导读</b>　${esc(r.summary)}</p>${r.readingGuide?`<p class="small">阅读建议：${esc(r.readingGuide)}</p>`:''}<p class="reading-q"><b>带着问题读</b>　${esc(r.question)}</p><div class="actions"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${action} ↗</a><a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener noreferrer">出版信息 ↗</a><button data-copy="${esc(r.id)}">复制题录</button></div></article>`;}
function filters(count){return `<div class="filters" aria-label="阅读筛选">${[['all','全部'],['core','重点阅读'],['extension','选读拓展']].map(([v,t])=>`<button data-filter="${v}" class="${v===filter?'active':''}" aria-pressed="${v===filter}">${t}</button>`).join('')}<span class="count">显示 ${count} 篇</span></div>`;}
function home(){return `<section class="hero"><p class="eyebrow">SOCIAL PSYCHOLOGY · 学习资源</p><h1>理解社会生活，<br>从问题与证据出发。</h1><p class="lead">方霞负责的8次课程安排：前7次授课，第8次期中测验与整合。每次包含3个45分钟课时。按课时学习核心概念、研究证据与应用方法。</p><div class="stats"><div><strong>7</strong><span>次授课</span></div><div><strong>1</strong><span>次测验与整合</span></div><div><strong>24</strong><span>个课时</span></div></div></section><h2>按课程进入</h2><div class="weekgrid">${course.weeks.map(w=>`<a class="weekitem" href="#week-${w.n}"><span class="num">第 ${String(w.n).padStart(2,'0')} 次 · ${w.kind==='assessment'?'学习评价':'3×45分钟'}</span><h3>${esc(w.title)}</h3><p>${w.periods.map(x=>esc(x.title)).join(' / ')}</p></a>`).join('')}</div><a href="#all">浏览全部文献 →</a>`;}
function prompt(w){return `你是社会心理学阅读助教。本次课主题是“${w.title}”。\n请仅依据我接下来粘贴的课堂材料、文章摘要或原文片段，帮助我理解，不要编造研究或引文。材料不足时请明确说明。\n本次关注：${w.focus}\n\n请按以下步骤反馈：\n1. 先指出我的回答中一处概念混淆或超出证据的推断。\n2. 引用我提供材料中的相关位置，解释为什么需要修正。\n3. 提出一个追问，让我自己修改；先不要替我写完整答案。\n4. 我修改后，再检查是否区分了研究结果、解释和适用范围。\n\n我的回答：[粘贴自己的回答]\n原文片段：[粘贴已阅读的材料]`;}
function schedule(w){return `<section class="schedule" aria-label="本次课时安排"><h2>本次安排：3×45分钟</h2><p class="small">${w.kind==='assessment'?'建议90分钟测验加45分钟整合。正式要求另行公布，以下练习用于复习，不是正式试题。':'每个课时有独立目标、活动与学习产出。展开查看具体安排，课间休息另计。'}</p>${w.periods.map(x=>`<details class="period"><summary><span>第${x.n}课时</span><strong>${esc(x.title)}</strong><em>45分钟</em></summary><div class="period-body"><p><b>目标</b>　${esc(x.goal)}</p><ol>${x.segments.map(z=>`<li><span>${z.minutes}分钟</span> ${esc(z.activity)}</li>`).join('')}</ol><p><b>学习产出</b>　${esc(x.output)}</p>${x.readingIds.length?`<button class="period-read" data-period="${x.n}">查看本课时阅读</button>`:''}</div></details>`).join('')}</section>`;}
function periodFilters(w){return `<div class="filters periods" aria-label="按课时筛选">${[['all','全部课时'],...[1,2,3].map(n=>[String(n),'第'+n+'课时'])].map(([v,t])=>`<button data-period="${v}" class="${v===periodFilter?'active':''}" aria-pressed="${v===periodFilter}">${t}</button>`).join('')}</div>`;}
function week(w){let body='';const rs=readings.filter(r=>r.week===w.n&&(filter==='all'||r.level===filter)&&(periodFilter==='all'||r.periods?.includes(Number(periodFilter))));if(tab==='knowledge')body=`${schedule(w)}<h2>${w.kind==='assessment'?'复习重点':'核心知识'}</h2><ul class="concepts">${w.concepts.map(([a,b])=>`<li><strong>${esc(a)}</strong><p>${esc(b)}</p></li>`).join('')}</ul><div class="focus">${esc(w.focus)}</div><div class="focus"><b>价值与应用</b><br>${esc(w.value)}</div><div class="connection"><b>教材对应</b>　${esc(w.textbook)}</div><button class="primary" data-tab="readings">${w.kind==='assessment'?'查看复习阅读指引':'查看本次研究与阅读'}</button>`;
if(tab==='readings')body=w.kind==='assessment'?`<h2>复习阅读指引</h2><p>${esc(w.readingLoad)}</p><div class="weekgrid">${course.weeks.filter(z=>z.n<8).map(z=>`<a class="weekitem" href="#week-${z.n}"><span class="num">第${z.n}次课</span><h3>${esc(z.title)}</h3><p>${esc(z.focus)}</p></a>`).join('')}</div>`:`<p class="small">${esc(w.readingLoad)} 可按课时筛选，先读导读与指定段落。</p>${periodFilters(w)}${filters(rs.length)}${rs.length?rs.map(paper).join(''):'<p class="empty">当前筛选下没有文献，请切换“全部”或其他课时。</p>'}`;
if(tab==='practice')body=`<p class="small">先独立作答，写清“已有证据”和“还需证据”，再展开参考思路。参考思路不是唯一答案。${w.kind==='assessment'?'本页为复习练习，正式测验题目另行安排。':''}</p>${w.quizzes.map((x,i)=>`<article class="question"><h3>问题 ${i+1}</h3><p>${esc(x.q)}</p><details><summary>展开参考思路</summary><p>${esc(x.a)}</p></details></article>`).join('')}<div class="task"><b>${w.kind==='assessment'?'测验后复盘':'课后任务'}</b><p>${esc(w.assignment)}</p></div>`;
if(tab==='ai')body=`<h2 style="margin-top:0">用AI帮助修正解释</h2><p class="ai-note">先独立作答，再复制提示词到你使用的AI工具。提供已经读过的材料，让AI追问和反馈，由你检查依据并修改。本页不提供在线聊天。${w.kind==='assessment'?'仅用于课前复习与课后复盘，正式测验是否允许使用工具，以教师公布的要求为准。':''}</p><pre class="prompt" id="prompt">${esc(prompt(w))}</pre><button class="primary" data-prompt="${w.n}">复制本次提示词</button><div class="focus"><b>检查反馈</b><br>它引用的内容是否确实在材料中？是否混淆了相关与因果、群体与个人，或测量与行为？提交作业时保留自己的修改理由。</div>`;
const localTabs=w.kind==='assessment'?[['knowledge','复习与安排'],['readings','复习阅读'],['practice','综合练习'],['ai','AI辅助复习']]:tabs;
return `<p class="eyebrow">第 ${String(w.n).padStart(2,'0')} 次 · ${esc(w.theme)} · 3×45分钟</p><h1>${esc(w.title)}</h1><p class="lead">${esc(w.subtitle)}</p><p class="goal">学习目标：${esc(w.goals)}</p><div class="tags">${w.keywords.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="tabs" role="tablist" aria-label="本次资源">${localTabs.map(([v,t])=>`<button role="tab" aria-selected="${v===tab}" data-tab="${v}">${t}</button>`).join('')}</div><section role="tabpanel">${body}</section><div class="connection">${esc(w.next)}</div><div class="between">${w.n>1?`<a href="#week-${w.n-1}">← 上一次课</a>`:'<a href="#home">← 课程首页</a>'}${w.n<8?`<a href="#week-${w.n+1}">下一次课 →</a>`:'<a href="#home">回到课程首页 →</a>'}</div>`;}
function all(){const rs=readings.filter(r=>filter==='all'||r.level===filter);return `<p class="eyebrow">课程阅读索引</p><h1>全部文献</h1><p class="lead">按7次授课与对应课时整理，另设第8次复习与测验。每篇附中文导读、阅读问题和来源入口。</p><div class="actions"><button class="primary" data-download>下载文献目录（TXT）</button></div><h2>阅读列表</h2>${filters(rs.length)}${rs.map(paper).join('')}`;}
function results(q){const n=q.toLocaleLowerCase();const rs=readings.filter(r=>[r.title,r.titleZh,r.authors,r.summary,r.question,r.doi].join(' ').toLocaleLowerCase().includes(n));const ws=course.weeks.filter(w=>[w.title,w.goals,w.keywords.join(' '),...w.concepts.flat()].join(' ').toLocaleLowerCase().includes(n));return `<p class="eyebrow">全库检索</p><h1>搜索“${esc(q)}”</h1><p class="small">${ws.length} 次课、${rs.length} 篇文献</p>${ws.length?`<div class="tags">${ws.map(w=>`<a class="tag" href="#week-${w.n}">第${w.n}次：${esc(w.title)}</a>`).join('')}</div>`:''}${rs.map(paper).join('')}${!rs.length&&!ws.length?'<p class="empty">未找到匹配内容。试试“IAT”“理想情绪”“偏见”或作者姓氏。</p>':''}`;}
function render(){const c=current(),q=$('#search').value.trim();$('#breadcrumb').textContent=q?'全库检索':typeof c==='number'?`第 ${c} 次课`:(c==='all'?'文献索引':'课程首页');$('#weeknav').innerHTML=`<a href="#home" ${c==='home'&&!q?'aria-current="page"':''}><b>⌂</b><span>课程首页</span></a>`+course.weeks.map(w=>`<a href="#week-${w.n}" ${c===w.n&&!q?'aria-current="page"':''}><b>${String(w.n).padStart(2,'0')}</b><span>${esc(w.title)}</span></a>`).join('');$('#content').innerHTML=q?results(q):typeof c==='number'?week(course.weeks[c-1]):c==='all'?all():home();document.title=(typeof c==='number'?course.weeks[c-1].title+'｜':'')+'社会心理学课程知识库';}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();}if(el.dataset.filter){filter=el.dataset.filter;render();}if(el.dataset.period){periodFilter=el.dataset.period;filter='all';tab='readings';render();}if(el.dataset.copy){const r=readings.find(r=>r.id===el.dataset.copy);if(r)copy(citation(r));}if(el.dataset.prompt)copy(prompt(course.weeks[Number(el.dataset.prompt)-1]));if(el.hasAttribute('data-download')){const t=readings.map(r=>`第${r.week}次课（第${r.periods?.join("、")||"—"}课时） · ${r.level==='core'?'重点阅读':'选读拓展'}\n${citation(r)}\n阅读入口：${r.url}\n访问类型：${r.access}\n中文导读：${r.summary}\n阅读问题：${r.question}`).join('\n\n');const u=URL.createObjectURL(new Blob(['社会心理学课程知识库｜方霞授课部分\n7次授课＋1次测验与整合，共24个45分钟课时\n整理日期：2026-11-03\n\n'+t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='社会心理学_8次课文献目录.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}});
window.addEventListener('hashchange',()=>{$('#search').value='';tab='knowledge';filter='all';periodFilter='all';render();window.scrollTo({top:0});});
$('#search').addEventListener('input',()=>render());
course=JSON.parse(document.getElementById('embedded-course').textContent);
readings=JSON.parse(document.getElementById('embedded-readings').textContent);
render();

</script></body></html>
